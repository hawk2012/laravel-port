; OPcache: продакшен-настройки. Правки кода подхватываются только после рестарта контейнера,
; для локальной разработки используйте `make dev` (volume + validate_timestamps=1).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = off
