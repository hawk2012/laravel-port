[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000
listen.backlog = 511

pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500

; Долгие запросы (SSR, тяжёлые выборки) не должны занимать воркер бесконечно.
request_terminate_timeout = 120s

access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
