openapi: 3.1.0
info:
  title: Laravel Port — AI Content API
  version: 1.0.0
  description: |
    REST API платформы генерации визуального и текстового контента.

    Аутентификация — Sanctum Bearer-токен, выдаётся в `/auth/register` и `/auth/login`.

    ## Жизненный цикл генерации

    1. `POST /projects/{project}/generations` — создаёт запись в статусе `queued`,
       списывает кредиты и ставит задачу в очередь.
    2. Воркер переводит запись в `processing` и вызывает AI-провайдера.
    3. По завершении — `completed` с ассетами либо `failed` с возвратом кредитов.

    Поллинг статуса: `GET /generations/{uuid}`. Для повторной отправки того же
    запроса передайте `idempotency_key` — вернётся существующая генерация.

    ## Коды ошибок

    | Код | HTTP | Значение |
    |-----|------|----------|
    | `unauthenticated` | 401 | Нет или истёк токен |
    | `insufficient_credits` | 402 | Не хватает кредитов |
    | `forbidden` | 403 | Ресурс принадлежит другому пользователю |
    | `not_found` | 404 | Ресурс не найден |
    | `rate_limited` | 429 | Превышен лимит запросов |
    | `concurrency_limit` | 429 | Слишком много одновременных генераций |
    | `validation_error` | 422 | Ошибки валидации полей |

servers:
  - url: http://localhost:8000/api/v1
    description: Локальная разработка

tags:
  - name: Auth
  - name: Projects
  - name: Generations
  - name: Assets
  - name: Usage

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 80, example: Михаил }
                email: { type: string, format: email, example: dev@example.com }
                password: { type: string, minLength: 10, example: StrongPass123 }
                password_confirmation: { type: string, example: StrongPass123 }
                device_name: { type: string, example: macbook }
      responses:
        '201':
          description: Пользователь создан, токен выдан
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Вход
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string }
      responses:
        '200':
          description: Токен выдан
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Текущий пользователь
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Отзыв текущего токена
      responses:
        '204': { description: Токен отозван }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /projects:
    get:
      tags: [Projects]
      summary: Список проектов
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Постраничный список
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
                  links: { $ref: '#/components/schemas/PaginationLinks' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Projects]
      summary: Создать проект
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string, maxLength: 500, nullable: true }
                settings: { type: object, additionalProperties: true, nullable: true }
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Project' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{project}:
    parameters:
      - { name: project, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Projects]
      summary: Проект по ID
      responses:
        '200':
          description: Проект
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Projects]
      summary: Обновить проект
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string, maxLength: 500, nullable: true }
                status: { type: string, enum: [active, archived] }
                settings: { type: object, additionalProperties: true, nullable: true }
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Projects]
      summary: Удалить проект (soft delete)
      responses:
        '204': { description: Удалено }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{project}/generations:
    post:
      tags: [Generations]
      summary: Создать генерацию
      description: |
        Списывает кредиты по типу (image — 5, video — 40, audio — 10, text — 1)
        и ставит задачу в очередь. Ответ приходит сразу со статусом `queued`.
      parameters:
        - { name: project, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, prompt]
              properties:
                type: { type: string, enum: [image, video, audio, text] }
                prompt: { type: string, minLength: 3, maxLength: 2000 }
                negative_prompt: { type: string, maxLength: 500, nullable: true }
                params:
                  type: object
                  properties:
                    size: { type: string, enum: ['1024x1024', '1024x576', '576x1024'] }
                    aspect_ratio: { type: string, enum: ['1:1', '16:9', '9:16'] }
                    temperature: { type: number, minimum: 0, maximum: 2 }
                idempotency_key: { type: string, maxLength: 80 }
      responses:
        '202':
          description: Принято в обработку
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Generation' }
        '402': { $ref: '#/components/responses/InsufficientCredits' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /generations:
    get:
      tags: [Generations]
      summary: История генераций
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, processing, completed, failed, cancelled] } }
        - { name: type, in: query, schema: { type: string, enum: [image, video, audio, text] } }
        - { name: project_id, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        '200':
          description: Постраничный список
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Generation' }
                  links: { $ref: '#/components/schemas/PaginationLinks' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

  /generations/{uuid}:
    parameters:
      - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Generations]
      summary: Статус генерации
      responses:
        '200':
          description: Генерация с ассетами
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Generation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /generations/{uuid}/cancel:
    post:
      tags: [Generations]
      summary: Отменить генерацию
      description: Возможно только в статусе `queued`. Кредиты возвращаются.
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Текущее состояние
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Generation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assets:
    get:
      tags: [Assets]
      summary: Медиатека
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [image, video, audio, text] } }
        - { name: project_id, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        '200':
          description: Постраничный список
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Asset' }

  /assets/{uuid}/download:
    get:
      tags: [Assets]
      summary: Скачать ассет
      description: Отдаёт файл только владельцу. Для `text` — `text/plain`.
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Бинарный поток
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Файл отсутствует на диске }

  /usage:
    get:
      tags: [Usage]
      summary: Сводка использования
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        '200':
          description: Агрегаты по пользователю
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      period_days: { type: integer }
                      summary:
                        type: object
                        properties:
                          generations: { type: integer }
                          completed: { type: integer }
                          failed: { type: integer }
                          credits_spent: { type: integer }
                          input_tokens: { type: integer }
                          output_tokens: { type: integer }
                          avg_latency_ms: { type: integer }
                          by_type:
                            type: object
                            additionalProperties: { type: integer }
                      projects:
                        type: object
                        properties:
                          active: { type: integer }
                          archived: { type: integer }
                          total: { type: integer }
                      daily_credits:
                        type: array
                        items:
                          type: object
                          properties:
                            date: { type: string, format: date }
                            credits: { type: integer }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        plan: { type: string, enum: [free, pro, scale] }
        plan_label: { type: string }
        credits_balance: { type: integer }
        concurrent_limit: { type: integer }
        created_at: { type: string, format: date-time }

    Project:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [active, archived] }
        settings: { type: object, additionalProperties: true, nullable: true }
        generations_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Generation:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        type: { type: string, enum: [image, video, audio, text] }
        status: { type: string, enum: [queued, processing, completed, failed, cancelled] }
        status_label: { type: string }
        prompt: { type: string }
        negative_prompt: { type: string, nullable: true }
        params: { type: object, additionalProperties: true, nullable: true }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }
        credits_used: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        latency_ms: { type: integer, nullable: true }
        error_message: { type: string, nullable: true }
        project:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
            slug: { type: string }
        assets:
          type: array
          items: { $ref: '#/components/schemas/Asset' }
        queued_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    Asset:
      type: object
      properties:
        id: { type: integer }
        uuid: { type: string, format: uuid }
        kind: { type: string, enum: [image, video, audio, text] }
        mime_type: { type: string }
        size_bytes: { type: integer }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        duration_ms: { type: integer, nullable: true }
        meta: { type: object, additionalProperties: true, nullable: true }
        created_at: { type: string, format: date-time }

    PaginationLinks:
      type: object
      properties:
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
        prev: { type: string, nullable: true }
        next: { type: string, nullable: true }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }

    Error:
      type: object
      properties:
        message: { type: string }
        code: { type: string }

  responses:
    Unauthenticated:
      description: Требуется аутентификация
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Нет доступа к ресурсу
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Превышен лимит запросов
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InsufficientCredits:
      description: Недостаточно кредитов
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  required: { type: integer }
                  available: { type: integer }
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
